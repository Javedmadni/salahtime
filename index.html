<style>
body {

    text-align: center;
    margin: 0;
    padding: 20px;
    background-color: #f4f4f9;

.container {
    max-width: 450px;

.header {

}
.contact-info {

    background-color: #e9ecef;
    border-bottom: 1px solid #ddd;
}
.contact-info p {
    margin: 3px 0;
    color: #333;
    font-size: 0.9em;
}
.widget-box {
    padding: 15px 10px;
}
.disclaimer {
    font-size: 0.85em;
    color: #cc0000;
    margin-bottom: 10px;
    font-weight: bold;
}
.location-box {
    background: #f0fff0;
    border: 1px solid #b7dfb7;
    border-radius: 8px;
    padding: 12px;
    margin: 15px auto;
    max-width: 300px;
}
.location-box h3 {
    color: #008000;
    margin: 0 0 8px;
    font-size: 16px;
}
#locationName {
    font-size: 14px;
    color: #333;
    overflow-wrap: anywhere;
}

    font-size: 0.8em;
    margin-top: 15px;
    padding-bottom: 10px;
    color: #999;
}
</style>

<body>
<div class="container">

</div>

<div class="contact-info">
<p>MALVANI, MHADA, MALAD, MUMBAI.</p>
<p>Mobile: <strong>+91 87791 22931</strong></p>
</div>

<div class="widget-box">

<h2>🕋 SALAH AND SUNRISE TIME</h2>

<p class="disclaimer">
PLEASE CONFIRM BEFORE YOU ACTION
</p>

<iframe
    title="IslamicFinder Prayer Times"
    style="width:182px;height:358px;border:1px solid #ddd;"
    scrolling="no"
    src="https://www.islamicfinder.org/prayer-widget/">
</iframe>

<div class="location-box">
<h3>📍 YOUR CURRENT LOCATION</h3>
<div id="locationName">Detecting location...</div>

<div class="footer-note">
(TIME AS PER ISLAMICFINDER.ORG, AND BASED ON YOUR LOCATION)
<br>
(جزاكم الله خيرا كثيرا)
</div>

</div>
</div>

<script>
const locationName = document.getElementById("locationName");

async function showLocation(position) {
    const lat = position.coords.latitude;
    const lon = position.coords.longitude;

    locationName.textContent = "Finding your city...";

    try {
        const url =
            "https://nominatim.openstreetmap.org/reverse" +
            "?format=jsonv2&lat=" + encodeURIComponent(lat) +
            "&lon=" + encodeURIComponent(lon) +
            "&zoom=10&addressdetails=1";

        const response = await fetch(url, {
            headers: { "Accept": "application/json" }
        });

        if (!response.ok) throw new Error("Location lookup failed");

        const data = await response.json();
        const a = data.address || {};

        const city =
            a.city || a.town || a.village ||
            a.municipality || a.county || "";

        const region = a.state || "";
        const country = a.country || "";

        const parts = [...new Set(
            [city, region, country].filter(Boolean)
        )];

        locationName.textContent =
            parts.join(", ") ||
            "Location found, but city name unavailable.";

    } catch (error) {
        locationName.textContent =
            "Location detected, but city name is unavailable.";
    }
}

function locationError(error) {
    if (error.code === 1) {
        locationName.textContent =
            "Please allow location access to see your city.";
    } else {
        locationName.textContent =
            "Unable to detect location. Please check GPS.";
    }
}

if ("geolocation" in navigator) {
    navigator.geolocation.getCurrentPosition(
        showLocation,
        locationError,
        {
            enableHighAccuracy: false,
            timeout: 15000,
            maximumAge: 300000
        }
    );
} else {
    locationName.textContent =
        "Location is not supported by this browser.";
}
</script>
